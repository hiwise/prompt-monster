<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prompt 打怪</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="col">
    <div id="hearts"></div>
    <button id="snd" class="pill" type="button">音效 开</button>
  </div>
  <div class="col end">
    <div id="progress" class="pill"></div>
    <div id="score" class="pill">0</div>
  </div>
</div>
<div id="mplate" class="hidden">
  <div id="mname"></div>
  <div class="bar"><i id="mhp"></i></div>
</div>
<div id="combo"></div>
<div id="hint">WASD / 方向键移动，或点击地面 · 走到怪物面前开战</div>
<div id="toast"></div>
<div id="flash"></div>
<div id="fx"></div>

<div id="battle" class="hidden">
  <p id="qscene"></p>
  <div id="opts"></div>
  <div id="explain" class="hidden">
    <p id="extext"></p>
    <button id="next" type="button">继续</button>
  </div>
</div>

<div id="overlay" class="title">
  <div class="card">
    <div class="kicker">提示词冒险 · 学习小游戏</div>
    <h1 id="otitle">Prompt 打怪</h1>
    <div id="obody">
      <p>你是一名见习<b>提示词法师</b>。前方的小路上有三只怪物，它们就是和 AI 协作时最常见的三种翻车：</p>
      <ul class="foes">
        <li><i style="background:#b58cff"></i>幻觉幽灵</li>
        <li><i style="background:#5fdc4e"></i>上下文溢出史莱姆</li>
        <li><i style="background:#cf7440"></i>「已修复」机器人</li>
      </ul>
      <p>走到怪物面前，从四张<b>技能卡</b>里打出对症的那一张才能命中；打错会被反击。</p>
    </div>
    <button id="obtn" type="button">开始冒险</button>
    <div class="links">
      <a class="linkbtn" href="https://x.com/hiwise_aigc" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        X 主页
      </a>
      <a class="linkbtn" href="https://github.com/hiwise/prompt-monster" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub 仓库
      </a>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="questions.js"></script>
<script src="js/kit.js"></script>
<script src="js/models.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
